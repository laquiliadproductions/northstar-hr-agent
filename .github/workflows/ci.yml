name: Northstar CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: northstar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test with Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PYTHONHASHSEED: "42"
      PYTHONPATH: .
      LLM_PROVIDER: groq
      LLM_API_KEY: ci-placeholder-key
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_MODEL: openai/gpt-oss-120b

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python source
        run: |
          python -m compileall -q src scripts

      - name: Verify application imports
        run: |
          python - <<'PY'
          from src.mcp_server.server import server
          from src.web.app import app

          assert app is not None
          assert server is not None

          print("Application and MCP server imports succeeded.")
          PY

      - name: Run automated tests
        run: |
          pytest -q
