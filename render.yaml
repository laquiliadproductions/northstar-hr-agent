services:
  - type: web
    name: northstar-hr-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/build_policy_index.py
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 src.web.app:app
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: PYTHONHASHSEED
        value: "42"
